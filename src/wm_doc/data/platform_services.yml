# Descriptions of webMethods platform services (`pub.*`, `wm.*`) for wm-doc.
#
# These services live in the product packages (WmPublic, WmART, WmJDBCAdapter, WmRoot), which
# are never part of the analysed packages. Each entry gives the service's full name, a one-line
# description written for wm-doc (not copied from product documentation), an effect family,
# and optionally where the call moves data:
#
#   data:
#     object: what is moved ("document", "file", ...)
#     system: where it goes ("HTTP", "JMS", ...)
#     object_inputs: documented input fields naming the object
#     where_inputs: documented input fields naming the location
#
# When a FLOW sets or maps one of those input fields, its value (or source path) is shown;
# nothing is guessed. Add or override entries without changing the tool with
# `--platform-services <your file>` (same format).
#
# Families: TRANSACTION, DATABASE, MESSAGING, REMOTE, FILE, IO, XML, JSON, FLAT_FILE, DOCUMENT,
# STRING, DATE, NUMERIC, LIST, ERROR_HANDLING, LOGGING, STORAGE, FLOW_CONTROL, SECURITY, SCHEMA,
# SERVER_ADMIN.

