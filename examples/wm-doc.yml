# Example wm-doc configuration. Pass it with `--config examples/wm-doc.yml`.
# Every section is optional; omitted sections use the built-in defaults.

packages:
  # Globs on the package directory name. Empty include = every package not excluded.
  include: []
  exclude: ["Wm*", "Default"]
  # Skip packages whose manifest.v3 says system_package=yes.
  skipSystemPackages: true

classification:
  importance:
    important:
      # Full-name globs (`namespace:service`), matched case-insensitively.
      fullName:
        - "acme.*.channel:*"
        - "acme.*.adapter:*"
      serviceName:
        - "*Service"
        - "process*"
    neverImportant:
      fullName:
        - "*utils*"
        - "*common.helpers*"
        - "pub.*"
        - "wm.*"
      serviceName:
        - "convert*"
        - "format*"
        - "log*"
  layers:
    CHANNEL: ["*.channel:*"]
    CORE: ["*.core:*"]
    ADAPTER: ["*.adapter:*"]
    UTILITY: ["*.utils:*", "*.util:*"]

extraction:
  # include | redact | omit. Secret-like values are blocked in every mode.
  literals:
    mode: include
  freeText:
    mode: include

describe:
  # The most characters `wm-doc describe` keeps of each field of a model's answer.
  # Names are checked on the whole answer first; a cut ends at a sentence or a word.
  # `null` keeps one field whole; `enabled: false` (or `fieldLimits: off`) keeps them all.
  # Changing these never invalidates the cached analysis.
  fieldLimits:
    enabled: true
    purpose: 400
    usage: 400          # lists of callers with long names may need more, e.g. 1500
    dataEffects: 900
    errorHandling: 300
    step: 200           # one item of Main steps
    detailedStep: 600   # one item of the detailed flow
    designerComment: 600
